version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next rules break on ESLint 10 (getFilename removed)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # better-sqlite3 13 segfaults during migrate/seed on Node 20
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      ui:
        patterns:
          - "radix-ui"
          - "shadcn"
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "tw-animate-css"
          - "class-variance-authority"
          - "lucide-react"
          - "sonner"
          - "next-themes"
      charts:
        patterns:
          - "recharts"
          - "@xyflow/react"
          - "leaflet"
          - "react-leaflet"
          - "@types/leaflet"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
